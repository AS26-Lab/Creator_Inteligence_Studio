[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-intelligence-studio"
version = "0.1.0"
description = "Creator Intelligence Studio"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Creator Intelligence Studio" }]
license = { text = "Proprietary" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-dir = "tests"
pattern = "test_*.py"

