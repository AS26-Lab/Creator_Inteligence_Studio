[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-intelligence-studio"
version = "0.1.0"
description = "Creator Intelligence Studio"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Creator Intelligence Studio" }]
license = { text = "Proprietary" }
dependencies = [
    "PySide6>=6.11.1,<7",
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.1",
    "numpy>=2.0,<3",
    "scikit-learn==1.7.2",
    "onnxruntime>=1.20,<2",
    "tokenizers>=0.21,<1",
    "backports.tarfile==1.2.0; platform_system == 'Windows'",
    "nvidia-cublas-cu12==12.9.2.10; platform_system == 'Windows'",
    "nvidia-cuda-runtime-cu12==12.9.79; platform_system == 'Windows'",
    "nvidia-cuda-nvrtc-cu12==12.9.86; platform_system == 'Windows'",
    "nvidia-cudnn-cu12==9.25.0.15; platform_system == 'Windows'",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"creator_intelligence_studio.presentation.desktop" = ["styles.qss"]

[tool.unittest]
start-dir = "tests"
pattern = "test_*.py"
